server {
    listen 80;
    server_name _;

    # Hide nginx version
    server_tokens off;

    # Upload limit — EPUB/PDF files can be large
    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://open.bigmodel.cn; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/wasm image/svg+xml font/woff2 application/manifest+json;
    gzip_min_length 256;

    # API v1 — direct pass-through
    # Covers: same-origin proxy to object storage. Book.cover_url stores
    # the public OSS base (http://IP:9000/read-pal/covers/...), but HTTPS
    # pages cannot load http: images (mixed content). The frontend
    # rewrites cover URLs to relative /covers/..., nginx fetches from
    # MinIO internally (plain http inside the host is fine).
    # NOTE: proxy_pass IP is hardcoded ops debt (static conf, no env
    # substitution; the OSS origin lives on the same VPS). No add_header
    # here: `expires 7d` already emits Cache-Control, and any add_header
    # in a location breaks inheritance of the server-level security
    # headers (CSP/XFO/HSTS/...) for that location.
    location /covers/ {
        proxy_pass http://175.178.66.207:9000/read-pal/covers/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # API (no version) — rewrite to /api/v1/ for frontend compatibility
    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # Frontend — Next.js standalone (handles all static assets)
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
