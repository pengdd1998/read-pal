[pytest]
# Pytest configuration for read-pal server tests.
#
# Engineering-upgrade B5 (2026-09-05): this file wins over the
# [tool.pytest.ini_options] table in pyproject.toml (pytest.ini has higher
# precedence), so it must stay the complete source of truth. The pyproject
# table is kept in sync — same markers, same addopts — to avoid the drift
# class where an edit lands in the shadowed file and silently never applies.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Test paths
testpaths = tests
addopts = --ignore=tests/test_full_paths.py

# Asyncio mode
asyncio_mode = auto

# Markers for different test types
markers =
    unit: Unit tests (SQLite in-memory, mocked services - default)
    integration: Integration tests (external infrastructure on VPS)
    slow: Slow-running tests
    auth: Authentication-related tests
    ai: AI/LLM-related tests
    smoke: End-to-end API smoke test (requires SMOKE_TARGET env var)

# xdist configuration for parallel testing (use -n auto locally)
# addopts = -n auto
asyncio_default_fixture_loop_scope = function
