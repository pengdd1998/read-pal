[pytest]
# Pytest configuration for read-pal server tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Markers for different test types
markers =
    unit: Unit tests (SQLite in-memory, mocked services - default)
    integration: Integration tests (external infrastructure on VPS)
    slow: Slow-running tests
    auth: Authentication-related tests
    ai: AI/LLM-related tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (run with: pytest --cov)
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
