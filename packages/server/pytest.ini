[pytest]
# Pytest configuration for read-pal server tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Markers for different test types
markers =
    unit: Unit tests (SQLite in-memory, mocked services - default)
    integration: Integration tests (external infrastructure on VPS)
    slow: Slow-running tests
    auth: Authentication-related tests
    ai: AI/LLM-related tests
