[project]
name = "read-pal-server"
version = "1.0.0"
description = "Read-Pal AI Reading Companion - Python Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0,<4.3.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    # "ebooklib>=0.18",  # blocked on Python 3.13 (lxml)
    "pypdf>=5.1.0",
    "defusedxml>=0.7.1",
    "minio>=7.2.0",
    "networkx>=3.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pgvector>=0.3.6",
    "numpy>=2.1.0",
    "email-validator>=2.3.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]

# ---------------------------------------------------------------------------
# Ruff — AST-level enforcement of rules documented in CONTRIBUTING.md and
# AGENTS.md. Phase 3 of the harness-engineering rollout. Add new rules
# incrementally; do not bulk-adopt past rule sets without per-rule review.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv", "tests/fixtures"]

[tool.ruff.lint]
# Curated rule set — each rule below corresponds to a documented Never rule
# in AGENTS.md or a CONTRIBUTING.md style requirement.
select = [
    "F",        # pyflakes (undefined names, unused imports)
    "E9",       # runtime errors (syntax, missing __init__)
    "PLR0915",  # too-many-statements (function-level; threshold in config)
    "C901",     # function complexity
    "UP",       # pyupgrade (modern syntax)
]
ignore = [
    "E501",  # line length handled by formatter, not linter
]

[tool.ruff.lint.pylint]
max-statements = 50  # matches CONTRIBUTING.md "Keep functions under 50 lines"

[tool.ruff.lint.mccabe]
max-complexity = 12  # double the default of 6 — reasonable for service code

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ignore=tests/test_full_paths.py"
# Phase 5.3 (M7): registered custom marks. ``smoke`` runs only when
# SMOKE_TARGET env var is set — used for pre-deploy validation.
markers = [
    "smoke: End-to-end API smoke test (requires SMOKE_TARGET env var)",
]
