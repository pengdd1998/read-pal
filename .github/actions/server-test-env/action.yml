name: 'Fake Settings env for tests'
description: |
  Single source of the 27-variable fake Settings block used by backend
  test steps. The block was copy-pasted across workflows and drifted
  once already (2026-08-28: prompt-eval's copy missed 21 fields and
  failed on ValidationError for weeks). Writing via $GITHUB_ENV applies
  to every subsequent step of the calling job.

  Deliberately NOT used by: the PostgreSQL job (intentionally different
  values — development mode, longer timeouts), the integration job
  (secrets-based), and live eval (real credentials).
runs:
  using: 'composite'
  steps:
    - name: Export fake Settings env
      shell: bash
      run: |
        cat >> "$GITHUB_ENV" <<'EOF'
        APP_ENV=test
        DB_HOST=localhost
        DB_PORT=5432
        DB_NAME=readpal_test
        DB_USER=test
        DB_PASSWORD=test
        REDIS_URL=redis://localhost:6379
        GLM_API_KEY=test-glm-key
        GLM_BASE_URL=https://test.example.com
        DEFAULT_MODEL=glm-4-flash
        FALLBACK_MODEL=glm-4-flash
        LLM_TIMEOUT_SECONDS=30
        LLM_MAX_RETRIES=2
        CIRCUIT_FAILURE_THRESHOLD=5
        CIRCUIT_RESET_TIMEOUT_SECONDS=60
        MAX_EMBEDDING_CALLS=100
        JWT_SECRET=test-jwt-secret-for-ci-min-32-chars-long
        JWT_EXPIRES_IN=7d
        JWT_ACCESS_WEB=15m
        JWT_ACCESS_MOBILE=30m
        JWT_REFRESH_WEB=7d
        JWT_REFRESH_MOBILE=30d
        FRONTEND_URL=http://localhost:3000
        CORS_ORIGINS=http://localhost:3000
        LOG_LEVEL=WARNING
        LOG_JSON=false
        LLM_LOG_ENABLED=true
        LLM_LOG_RETENTION_DAYS=7
        EOF
