name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'
  JAVA_VERSION: '21'

jobs:
  # -------------------------------------------------------------------
  # Build Next.js static export (shared by Android + iOS)
  # -------------------------------------------------------------------
  build-web:
    name: Build Static Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      # Static export produces packages/web/out/ with 60+ HTML pages
      - name: Build Next.js static export
        working-directory: packages/web
        run: npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Verify static output
        run: |
          test -f packages/web/out/index.html && echo "Static export OK" || (echo "FAIL: out/index.html missing" && exit 1)

      # Upload the out/ directory for downstream jobs to consume
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: packages/web/out/
          retention-days: 1

  # -------------------------------------------------------------------
  # Android APK (debug, unsigned)
  # -------------------------------------------------------------------
  build-android:
    name: Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Java 21 required for Capacitor 8.x / AGP 8.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/web/android/**/*.gradle*', 'packages/web/android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download the pre-built static export into packages/web/out/
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: packages/web/out/

      # Initialize native project if absent (first run on a fresh checkout)
      - name: Ensure Android project exists
        working-directory: packages/web
        run: test -d android || npx cap add android

      # Sync static assets from out/ into the Android project
      - name: Capacitor sync Android
        working-directory: packages/web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: packages/web/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: read-pal-android-debug
          path: packages/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # -------------------------------------------------------------------
  # iOS IPA (unsigned archive, macOS runner required)
  # -------------------------------------------------------------------
  build-ios:
    name: iOS IPA
    needs: build-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download the pre-built static export into packages/web/out/
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: packages/web/out/

      # Initialize native project if absent (first run on a fresh checkout)
      - name: Ensure iOS project exists
        working-directory: packages/web
        run: test -d ios || npx cap add ios

      # Sync static assets from out/ into the iOS project
      - name: Capacitor sync iOS
        working-directory: packages/web
        run: npx cap sync ios

      # Build unsigned archive using xcodeproj (no xcworkspace in this project)
      - name: Build iOS archive (unsigned)
        working-directory: packages/web/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # Package the archive into an IPA for sideloading / re-signing
      - name: Create IPA from archive
        working-directory: packages/web/ios/App
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../App.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: read-pal-ios-unsigned
          path: packages/web/ios/App/build/App.ipa
          retention-days: 7
