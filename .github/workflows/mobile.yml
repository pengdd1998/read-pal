name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'mobile-v*'
  pull_request:
    paths:
      - 'packages/mobile/**'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'

jobs:
  # -------------------------------------------------------------------
  # Typecheck and verify
  # -------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      - name: Typecheck mobile
        run: pnpm --filter @read-pal/mobile typecheck

  # -------------------------------------------------------------------
  # Android APK (prebuild + Gradle)
  # -------------------------------------------------------------------
  build-android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/**/build.gradle*', 'packages/mobile/android/**/settings.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate native project
        working-directory: packages/mobile
        run: npx expo prebuild -p android --clean

      - name: Stub react-native-worklets for pnpm compat
        working-directory: packages/mobile
        run: |
          mkdir -p node_modules/react-native-worklets
          echo '{"name":"react-native-worklets","version":"0.0.0-stub","main":"plugin.js"}' > node_modules/react-native-worklets/package.json
          echo 'module.exports = function() { return { visitor: {} }; };' > node_modules/react-native-worklets/plugin.js

      - name: Bundle JS with Metro
        working-directory: packages/mobile
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          ENTRY=$(node -e "console.log(require.resolve('expo-router/entry'))")
          echo "Entry file: $ENTRY"
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file "$ENTRY" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache \
            --config metro.config.js \
            --verbose

      - name: Build APK (skip JS bundling)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease -x createBundleReleaseJsAndAssets -x bundleReleaseJsAndAssets

      - name: Rename APK
        working-directory: packages/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/release/app-release.apk read-pal-android-${VERSION}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: read-pal-android-apk
          path: packages/mobile/read-pal-android-*.apk
          retention-days: 30

  # -------------------------------------------------------------------
  # Create GitHub Release (Android only for now, iOS needs code signing)
  # -------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: read-pal-android-apk
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.event_name == 'workflow_dispatch' && '1.1.0' || github.ref_name }}
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
