name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'mobile-v*'
  pull_request:
    paths:
      - 'packages/mobile/**'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'

jobs:
  # -------------------------------------------------------------------
  # Typecheck and verify
  # -------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      - name: Typecheck mobile
        run: pnpm --filter @read-pal/mobile typecheck

  # -------------------------------------------------------------------
  # Android APK (local build)
  # -------------------------------------------------------------------
  build-android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/**/gradle*', 'packages/mobile/android/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK (local)
        working-directory: packages/mobile
        run: |
          eas build --platform android --profile development --local --output ./app.apk
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Rename APK
        working-directory: packages/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv app.apk read-pal-android-${VERSION}-development.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: read-pal-android-apk
          path: packages/mobile/read-pal-android-*.apk
          retention-days: 30

  # -------------------------------------------------------------------
  # iOS IPA (local build, macOS only)
  # -------------------------------------------------------------------
  build-ios:
    name: iOS IPA
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @read-pal/shared build

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS IPA (local, unsigned)
        working-directory: packages/mobile
        run: |
          eas build --platform ios --profile development --local --output ./app.ipa
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Rename IPA
        working-directory: packages/mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv app.ipa read-pal-ios-${VERSION}-development.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: read-pal-ios-ipa
          path: packages/mobile/read-pal-ios-*.ipa
          retention-days: 30

  # -------------------------------------------------------------------
  # Create GitHub Release on tag
  # -------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: read-pal-android-apk
          path: ./artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: read-pal-ios-ipa
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
