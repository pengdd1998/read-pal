name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if deploy is needed based on changed files
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'packages/server/**'
              - 'docker-compose.yml'
              - 'docker/**'
            web:
              - 'packages/web/**'
            deploy:
              - '.github/workflows/deploy.yml'
              - 'docker-compose.yml'

  deploy:
    name: Deploy to VPS
    needs: check-changes
    if: needs.check-changes.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/home/ubuntu/projects/read-pal"
            cd "$DEPLOY_PATH"

            # -------------------------------------------------------
            # 0. Pre-flight checks
            # -------------------------------------------------------

            # Clear stale ghcr.io credentials (causes 403 on public images)
            docker logout ghcr.io 2>/dev/null || true

            # Resource guard - abort if VPS is overloaded
            # -------------------------------------------------------
            AVAIL_MEM=$(free -m | awk '/Mem:/{print $7}')
            if [ "$AVAIL_MEM" -lt 300 ]; then
              echo "❌ Insufficient memory (${AVAIL_MEM}MB available, need 300MB). Aborting deploy."
              exit 1
            fi

            DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
            DISK_AVAIL_GB=$((DISK_AVAIL / 1024 / 1024))
            if [ "$DISK_AVAIL" -lt 524288 ]; then
              echo "⚠ Low disk (${DISK_AVAIL_GB}GB), pruning..."
              docker system prune -af 2>/dev/null || true
              docker builder prune -f --filter "until=24h" 2>/dev/null || true
              DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
              if [ "$DISK_AVAIL" -lt 524288 ]; then
                echo "❌ Still low disk after prune. Aborting deploy."
                exit 1
              fi
            fi

            # -------------------------------------------------------
            # 1. Pull latest code
            # -------------------------------------------------------
            echo ">>> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # -------------------------------------------------------
            # 2. Detect which services need rebuild
            # -------------------------------------------------------
            CHANGED=$(git diff --name-only HEAD~1 HEAD)

            REBUILD_API=false
            REBUILD_WEB=false

            echo "$CHANGED" | grep -qE '^(packages/server/|docker-compose\.yml|docker/)' && REBUILD_API=true
            echo "$CHANGED" | grep -qE '^packages/web/' && REBUILD_WEB=true

            # Also rebuild if deploy config changed
            echo "$CHANGED" | grep -qE '^\.github/workflows/deploy\.yml$' && REBUILD_API=true && REBUILD_WEB=true

            # -------------------------------------------------------
            # 3. Rebuild only changed containers
            # -------------------------------------------------------
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            if [ "$REBUILD_API" = true ]; then
              echo ">>> Rebuilding API container..."
              docker compose build --progress=plain api
            else
              echo ">>> Skipping API rebuild (no changes detected)"
            fi

            if [ "$REBUILD_WEB" = true ]; then
              echo ">>> Rebuilding Web container..."
              docker compose build --progress=plain web
            else
              echo ">>> Skipping Web rebuild (no changes detected)"
            fi

            # -------------------------------------------------------
            # 4. Start containers (recreates changed services)
            # -------------------------------------------------------
            echo ">>> Starting containers..."
            docker compose up -d --remove-orphans

            sleep 3
            docker compose restart nginx

            # -------------------------------------------------------
            # 5. Run database migrations (only if API was rebuilt)
            # -------------------------------------------------------
            if [ "$REBUILD_API" = true ]; then
              echo ">>> Running database migrations..."
              docker compose exec -T api python -m alembic upgrade head
            else
              echo ">>> Skipping migrations (API not rebuilt)"
            fi

            # -------------------------------------------------------
            # 6. Health checks with retry
            # -------------------------------------------------------
            echo ">>> Waiting for services to be ready..."

            check_health() {
              local name="$1"
              local url="$2"
              local status="000"
              for i in 1 2 3 4 5 6; do
                status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
                if [ "$status" = "200" ]; then
                  echo "  $name OK (attempt $i)"
                  return 0
                fi
                echo "  $name not ready (attempt $i, status=$status)..."
                sleep 10
              done
              echo "❌ $name health check failed: $status"
              return 1
            }

            check_health "API" "http://localhost:8090/api/v1/health"
            check_health "Web" "http://localhost:8090/en"

            # -------------------------------------------------------
            # 7. Cleanup
            # -------------------------------------------------------
            echo ">>> Cleaning up..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter "until=24h" 2>/dev/null || true

            DISK_USAGE=$(df -h . | tail -1 | awk '{print $5}')
            echo "✅ Deploy complete — Disk usage: $DISK_USAGE"
