name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch/reset/diff on the VPS but touch no containers (no build, no migration, no edge reload, no marker write)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  # Queue, never cancel (M0.6): a cancelled deploy can die mid
  # `docker compose up`, leaving mixed-version containers with no
  # health-check pass — the marker only guards missed ranges, not
  # half-executed switches. CI keeps cancel-in-progress semantics;
  # deploys must run to completion.
  cancel-in-progress: false

jobs:
  # Gate: wait for the CI run of this exact commit to succeed before deploying.
  ci-gate:
    name: Wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for CI run of the same commit to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHA="${{ github.sha }}"
          echo "Looking for CI run of commit ${SHA}..."

          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow ci.yml \
              --commit "$SHA" \
              --json databaseId,status \
              --jq '.[] | select(.status != "queued") | .databaseId' \
              2>/dev/null | head -1 || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "  attempt $i: no started CI run for ${SHA} yet, retrying in 20s..."
            sleep 20
          done

          if [ -z "$RUN_ID" ]; then
            echo "❌ No CI run started for commit ${SHA} within 10 minutes. Aborting deploy."
            exit 1
          fi

          echo ">>> Watching CI run ${RUN_ID} (timeout 20 min)..."
          gh run watch "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --exit-status \
            --interval 15 || {
              echo "❌ CI run ${RUN_ID} did not succeed. Blocking deploy."
              exit 1
            }

          echo "✅ CI passed for ${SHA} — deploy may proceed."

  deploy:
    name: Deploy to VPS
    needs: [ci-gate]
    # Deploy on every push (inverted default, M0.6): the old paths-filter
    # gate let server-side fixes stranded between skipped commits stay out
    # of prod (2026-09-16: eb582e83 never shipped until a later web commit
    # carried it; `gh run watch` reported the skipped deploy as success).
    # What gets REBUILT is decided VPS-side by the deploy-marker diff — an
    # empty run costs only fetch/compose-up/health-checks (~2-3 min).
    # Manual dispatch skips the CI gate (operator-controlled).
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.ci-gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          TARGET_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 95m
          envs: DRY_RUN,TARGET_REF
          script: |
            set -euo pipefail

            DEPLOY_PATH="/home/ubuntu/projects/read-pal"
            cd "$DEPLOY_PATH"

            # -------------------------------------------------------
            # 0. Pre-flight checks
            # -------------------------------------------------------

            # Clear stale ghcr.io credentials (causes 403 on public images)
            docker logout ghcr.io 2>/dev/null || true

            # Resource guard - abort if VPS is overloaded
            # -------------------------------------------------------
            AVAIL_MEM=$(free -m | awk '/Mem:/{print $7}')
            if [ "$AVAIL_MEM" -lt 300 ]; then
              echo "❌ Insufficient memory (${AVAIL_MEM}MB available, need 300MB). Aborting deploy."
              exit 1
            fi

            DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
            DISK_AVAIL_GB=$((DISK_AVAIL / 1024 / 1024))
            if [ "$DISK_AVAIL" -lt 524288 ]; then
              echo "⚠ Low disk (${DISK_AVAIL_GB}GB), pruning..."
              docker system prune -af 2>/dev/null || true
              docker builder prune -f --filter "until=24h" 2>/dev/null || true
              DISK_AVAIL=$(df / | tail -1 | awk '{print $4}')
              if [ "$DISK_AVAIL" -lt 524288 ]; then
                echo "❌ Still low disk after prune. Aborting deploy."
                exit 1
              fi
            fi

            # -------------------------------------------------------
            # 1. Pull latest code (remember previous SHA for rollback)
            # -------------------------------------------------------
            echo ">>> Pulling latest code..."
            PREV_SHA=$(git rev-parse HEAD)
            echo ">>> Previous commit (rollback target): ${PREV_SHA}"
            # Push always targets main; a workflow_dispatch rehearsal may
            # target a branch, so follow the triggering ref.
            git fetch origin "${TARGET_REF}"
            git reset --hard "origin/${TARGET_REF}"

            # -------------------------------------------------------
            # 2. Detect which services need rebuild
            # -------------------------------------------------------
            # Diff against the LAST SUCCESSFULLY DEPLOYED sha, not HEAD~1:
            # a cancelled deploy still advances the checkout (git reset runs
            # before build), so HEAD~1-based detection missed the entire
            # skipped range and stale images kept running (2026-09-08: the
            # observability batch never shipped because its deploy was
            # cancelled and the follow-up commit touched only tests).
            # Marker file is written after health checks pass; missing marker
            # => first deploy with this scheme => rebuild everything.
            DEPLOY_MARKER=.last-deployed-sha
            if [ -f "$DEPLOY_MARKER" ] && git rev-parse -q --verify "$(cat $DEPLOY_MARKER)" >/dev/null 2>&1; then
              DEPLOY_BASE=$(cat "$DEPLOY_MARKER")
              CHANGED=$(git diff --name-only "$DEPLOY_BASE" HEAD)
            else
              DEPLOY_BASE="none"
              CHANGED="packages/server/app packages/web/src"
              echo ">>> No valid deploy marker - full rebuild."
            fi
            echo ">>> Deploy base: ${DEPLOY_BASE} HEAD: $(git rev-parse HEAD)"

            REBUILD_API=false
            REBUILD_WEB=false

            echo "$CHANGED" | grep -qE '^(packages/server/|docker-compose\.yml|docker/)' && REBUILD_API=true
            echo "$CHANGED" | grep -qE '^packages/web/' && REBUILD_WEB=true

            # Also rebuild if deploy config changed
            echo "$CHANGED" | grep -qE '^\.github/workflows/deploy\.yml$' && REBUILD_API=true && REBUILD_WEB=true

            # Edge fragment (docker/edge.caddy) changed -> converge to the
            # platform edge (cp + validate + reload) BEFORE `up -d` (C-3):
            # traffic switches to the alias routes while the old chain is
            # still intact, making the cutover zero-window. validate failure
            # aborts BEFORE any container change — prod untouched.
            EDGE_FRAG_CHANGED=false
            echo "$CHANGED" | grep -qE '^docker/edge\.caddy$' && EDGE_FRAG_CHANGED=true

            # -------------------------------------------------------
            # 2.5 Dry-run stop: everything above is reversible (checkout
            #     advance without a marker write is exactly the case the
            #     marker design covers — the next deploy re-diffs from the
            #     marker and catches this range). Nothing below here runs.
            # -------------------------------------------------------
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo ""
              echo "=== DRY RUN — stopping before any container change ==="
              echo "Would rebuild API: $REBUILD_API"
              echo "Would rebuild WEB: $REBUILD_WEB"
              echo "Changed files since deploy marker (${DEPLOY_BASE}):"
              echo "$CHANGED" | head -40
              echo "Touched: git fetch/reset only. NOT touched: builds, migrations, edge, containers, marker."
              exit 0
            fi

            # -------------------------------------------------------
            # 3. Rebuild only changed containers
            # -------------------------------------------------------
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            if [ "$REBUILD_API" = true ]; then
              echo ">>> Rebuilding API container..."
              docker compose build --progress=plain api
            else
              echo ">>> Skipping API rebuild (no changes detected)"
            fi

            if [ "$REBUILD_WEB" = true ]; then
              echo ">>> Rebuilding Web container..."
              docker compose build --progress=plain web
            else
              echo ">>> Skipping Web rebuild (no changes detected)"
            fi

            # -------------------------------------------------------
            # 4. Run database migrations BEFORE swapping containers.
            #    Migrations run in a one-off container built from the NEW
            #    image, so the schema is always ready before new code serves.
            #    (`run` inherits the api service environment + networks.)
            # -------------------------------------------------------
            if [ "$REBUILD_API" = true ]; then
              echo ">>> Running database migrations (pre-switch)..."
              docker compose run --rm api python -m alembic upgrade head
            else
              echo ">>> Skipping migrations (API not rebuilt)"
            fi

            # -------------------------------------------------------
            # 4.5 Edge fragment converge — BEFORE `up -d` (cutover zero-
            #     window, C-3): reload switches traffic to the alias routes
            #     (readpal-api/readpal-web exist since A0, not dependent on
            #     any container swap); the old chain keeps running but gets
            #     no traffic. Only runs when docker/edge.caddy changed.
            #     Ordering note (deliberate): the REVERT of the cutover PR
            #     restores the pre-cutover deploy.yml where this hook runs
            #     AFTER up — which is exactly the order the rollback
            #     direction needs (nginx back in place before the dumb-
            #     forward fragment is reloaded). Do not "fix" this ordering
            #     on one side only.
            # -------------------------------------------------------
            if [ "$EDGE_FRAG_CHANGED" = true ]; then
              echo ">>> Edge fragment changed — converge + atomic reload..."
              cp docker/edge.caddy /srv/infra/sites/readpal.caddy
              docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
              docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
            else
              echo ">>> Skipping edge reload (fragment unchanged)"
            fi

            # -------------------------------------------------------
            # 5. Start containers (recreates changed services)
            # -------------------------------------------------------
            echo ">>> Starting containers..."
            docker compose up -d --remove-orphans

            # -------------------------------------------------------
            # 6. Health checks with retry
            # -------------------------------------------------------
            echo ">>> Waiting for services to be ready..."

            check_health() {
              local name="$1"
              local url="$2"
              local status="000"
              for i in 1 2 3 4 5 6; do
                # -k: the only live entry today is the IP site with its
                # self-signed cert (read.chishenma.top cannot obtain one
                # until ICP filing passes — DNSPod serves a block page to
                # the ACME challenge). Revisit when the filing clears.
                status=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
                if [ "$status" = "200" ]; then
                  echo "  $name OK (attempt $i)"
                  return 0
                fi
                echo "  $name not ready (attempt $i, status=$status)..."
                sleep 10
              done
              echo "❌ $name health check failed: $status"
              return 1
            }

            # -------------------------------------------------------
            # 7. Rollback on failed health check — never leave a broken
            #    deployment serving. Rebuild from PREV_SHA and re-verify.
            #    (guarded, not bare: `set -e` would exit before rollback)
            # -------------------------------------------------------
            rollback() {
              echo ""
              echo "❌❌❌ HEALTH CHECK FAILED — STARTING ROLLBACK ❌❌❌"
              echo ">>> Rolling back to previous commit: ${PREV_SHA}"
              git reset --hard "${PREV_SHA}"
              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1
              echo ">>> Rebuilding containers at rollback commit..."
              docker compose build api || true
              docker compose build web || true
              echo ">>> Restarting containers at rollback commit..."
              docker compose up -d --remove-orphans
              # Fragment re-converge AFTER up — the rollback direction needs
              # the pre-cutover chain (nginx on 8090) back in place before
              # the dumb-forward fragment is reloaded (C-5 rationale). The
              # checkout already holds the rolled-back fragment.
              cp docker/edge.caddy /srv/infra/sites/readpal.caddy \
                && docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile \
                && docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile || true
              sleep 10
              if check_health "API (rollback)" "https://175.178.66.207/api/v1/health" \
                 && check_health "Web (rollback)" "https://175.178.66.207/en"; then
                echo "✅ Rollback successful — service restored to ${PREV_SHA}"
              else
                echo "❌ Rollback ALSO failed health checks — manual intervention required."
                echo "    Inspect: docker compose ps && docker compose logs --tail=100 api"
              fi
            }

            # Health checks target the platform edge (the only entry after
            # the cutover): the IP site with its self-signed cert — the
            # domain cannot get a cert until ICP filing passes (DNSPod
            # blocks the ACME challenge), so -k in check_health and IP URLs.
            if ! check_health "API" "https://175.178.66.207/api/v1/health" || \
               ! check_health "Web" "https://175.178.66.207/en"; then
              rollback
              exit 1
            fi

            # -------------------------------------------------------
            # 8. Cleanup
            # -------------------------------------------------------
            echo ">>> Cleaning up..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter "until=24h" 2>/dev/null || true

            DISK_USAGE=$(df -h . | tail -1 | awk '{print $5}')
            # Record the deployed sha ONLY after the health checks above
            # passed - a cancelled/failed deploy must not advance the marker.
            git rev-parse HEAD > "$DEPLOY_MARKER"
            echo "✅ Deploy complete — Disk usage: $DISK_USAGE"
