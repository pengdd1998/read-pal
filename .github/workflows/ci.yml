name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.12.0'

jobs:
  # -------------------------------------------------------------------
  # Typecheck frontend
  # -------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @read-pal/shared build

      - run: pnpm --filter @read-pal/web typecheck

      - run: pnpm --filter @read-pal/mobile typecheck

  # -------------------------------------------------------------------
  # Build verification
  # -------------------------------------------------------------------
  build:
    name: Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared first (dependency for web)
        if: matrix.package != 'shared'
        run: pnpm --filter @read-pal/shared build

      - name: Build ${{ matrix.package }}
        run: pnpm --filter @read-pal/${{ matrix.package }} build
        env:
          NEXT_PUBLIC_API_URL: ''

  # -------------------------------------------------------------------
  # Python backend tests
  # -------------------------------------------------------------------
  test-backend:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - run: cd packages/server && uv sync --all-groups --all-extras

      # -----------------------------------------------------------------
      # Phase 3: AST-level enforcement of AGENTS.md Never rules
      # -----------------------------------------------------------------
      - name: Ruff lint (curated rule set)
        working-directory: packages/server
        run: uv run ruff check app/

      - name: Custom AST checks (file-length, router-thin, no-raw-book-fields)
        working-directory: packages/server
        run: |
          uv run python scripts/check_file_length.py app/
          uv run python scripts/check_router_thin.py app/routers/
          uv run python scripts/check_no_raw_book_fields.py app/services/
          uv run python scripts/check_inflight_streams_encapsulation.py app/services/agent_service.py

      - run: cd packages/server && uv run pytest --tb=short -v --durations=10
        env:
          APP_ENV: test
          # Database (not used in unit tests — SQLite in-memory)
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: readpal_test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_URL: redis://localhost:6379
          # GLM AI (mocked in tests — real key not needed)
          GLM_API_KEY: test-glm-key
          GLM_BASE_URL: https://test.example.com
          DEFAULT_MODEL: glm-4-flash
          FALLBACK_MODEL: glm-4-flash
          LLM_TIMEOUT_SECONDS: 30
          LLM_MAX_RETRIES: 2
          CIRCUIT_FAILURE_THRESHOLD: 5
          CIRCUIT_RESET_TIMEOUT_SECONDS: 60
          MAX_EMBEDDING_CALLS: 100
          # JWT
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          JWT_EXPIRES_IN: 7d
          JWT_ACCESS_WEB: 15m
          JWT_ACCESS_MOBILE: 30m
          JWT_REFRESH_WEB: 7d
          JWT_REFRESH_MOBILE: 30d
          # App
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          # Logging
          LOG_LEVEL: WARNING
          LOG_JSON: false
          LLM_LOG_ENABLED: true
          LLM_LOG_RETENTION_DAYS: 7

  # -------------------------------------------------------------------
  # Frontend tests (Vitest)
  # -------------------------------------------------------------------
  test-web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        # web imports @read-pal/shared (SSE types, constants) — vitest resolves
        # the built dist, so build it first (test files that import shared
        # fail resolution without this).
        run: pnpm --filter @read-pal/shared build

      - name: Run frontend tests
        # `test` script is `vitest run` (non-watch) — the bare `vitest` CLI would
        # default to watch mode in CI; `vitest run` is explicit and idempotent.
        run: pnpm --filter @read-pal/web test

  # -------------------------------------------------------------------
  # Migration integrity — apply full chain to an empty PostgreSQL 16
  # -------------------------------------------------------------------

  postgres-tests:
    name: Python Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ratchet: first iterations run non-blocking while PG-only failures
    # are triaged; flip to a hard gate once green (tracked in the plan doc).
    continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: readpal
          POSTGRES_PASSWORD: readpal_ci
          POSTGRES_DB: readpal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readpal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://readpal:readpal_ci@localhost:5432/readpal_ci
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: readpal_ci
      DB_USER: readpal
      DB_PASSWORD: readpal_ci
      REDIS_URL: redis://localhost:6379
      GLM_API_KEY: test-glm-key
      GLM_BASE_URL: https://test.example.com
      DEFAULT_MODEL: glm-4-flash
      FALLBACK_MODEL: glm-4-flash
      LLM_TIMEOUT_SECONDS: '15'
      LLM_MAX_RETRIES: '3'
      CIRCUIT_FAILURE_THRESHOLD: '5'
      CIRCUIT_RESET_TIMEOUT_SECONDS: '30'
      MAX_EMBEDDING_CALLS: '300'
      JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
      JWT_EXPIRES_IN: 7d
      JWT_ACCESS_WEB: 30m
      JWT_ACCESS_MOBILE: 2h
      JWT_REFRESH_WEB: 7d
      JWT_REFRESH_MOBILE: 30d
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
      LOG_LEVEL: INFO
      LOG_JSON: 'false'
      LLM_LOG_ENABLED: 'false'
      LLM_LOG_RETENTION_DAYS: '90'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - name: Install dependencies
        run: cd packages/server && uv sync --frozen

      - name: Enable pgvector extension
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U readpal -d readpal_ci             -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Run test suite against PostgreSQL
        working-directory: packages/server
        run: uv run pytest tests -q --tb=line

  migrations:
    name: Alembic Upgrade/Downgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image — migration 0004 creates the vector extension,
        # which stock postgres:16 doesn't ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: readpal
          POSTGRES_PASSWORD: readpal_ci
          POSTGRES_DB: readpal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readpal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: readpal_ci
      DB_USER: readpal
      DB_PASSWORD: readpal_ci
      REDIS_URL: redis://localhost:6379
      GLM_API_KEY: test-glm-key
      GLM_BASE_URL: https://test.example.com
      DEFAULT_MODEL: glm-4-flash
      FALLBACK_MODEL: glm-4-flash
      LLM_TIMEOUT_SECONDS: '15'
      LLM_MAX_RETRIES: '3'
      CIRCUIT_FAILURE_THRESHOLD: '5'
      CIRCUIT_RESET_TIMEOUT_SECONDS: '30'
      MAX_EMBEDDING_CALLS: '300'
      JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
      JWT_EXPIRES_IN: 7d
      JWT_ACCESS_WEB: 30m
      JWT_ACCESS_MOBILE: 2h
      JWT_REFRESH_WEB: 7d
      JWT_REFRESH_MOBILE: 30d
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
      LOG_LEVEL: INFO
      LOG_JSON: 'false'
      LLM_LOG_ENABLED: 'false'
      LLM_LOG_RETENTION_DAYS: '90'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - name: Install dependencies
        run: cd packages/server && uv sync --frozen

      - name: Upgrade from empty database to head
        run: cd packages/server && uv run alembic upgrade head

      - name: Downgrade to base and re-upgrade (reversibility)
        run: cd packages/server && uv run alembic downgrade base && uv run alembic upgrade head

      - name: Verify schema revision at head
        run: cd packages/server && uv run alembic current

  # -------------------------------------------------------------------
  # Integration tests (requires external infrastructure - manual only)
  # -------------------------------------------------------------------
  test-backend-integration:
    name: Python Tests (Integration)
    runs-on: ubuntu-latest
    # Only run when manually triggered with workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - run: cd packages/server && uv sync --all-groups --all-extras

      - name: Run integration tests
        run: |
          cd packages/server && uv run pytest -m integration -v || {
            echo "Note: Integration tests may not exist yet (exit code 5 = no tests collected)"
            exit 0
          }
        env:
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          TEST_USE_EXTERNAL_INFRA: true
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
          TEST_MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          TEST_MINIO_PORT: ${{ secrets.TEST_MINIO_PORT }}
          TEST_MINIO_ACCESS_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          TEST_MINIO_SECRET_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
