name: Prompt Eval

# Runs whenever a PR touches prompt templates, LLM output schemas, or
# translations — the surfaces most likely to cause silent format drift,
# hallucination regressions, or zh/en placeholder mismatch. Catches:
#   - PromptTemplate variable/placeholder drift (test_prompt_rendering.py)
#   - Sanitizer regressions (test_book_field_sanitization.py)
#   - Schema validation regressions (test_llm_output_schemas.py)
#   - Eval infrastructure (app.eval.eval_runner, mocked mode)
#
# Live-mode evals against real LLM providers are intentionally NOT here —
# they require API budget and a PROMPT_EVAL_API_KEY secret. Run them
# locally via `uv run python -m app.eval.eval_runner` before merging
# prompt-content changes (especially Mirror sections).

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/server/app/prompts/**'
      - 'packages/server/app/schemas/llm_outputs.py'
      - 'packages/server/app/translations/**'
      - 'packages/server/app/utils/sanitizer.py'
      - 'packages/server/app/services/llm/safe_invoke.py'
      - 'packages/server/app/eval/**'
      - 'packages/server/tests/test_prompt_rendering.py'
      - 'packages/server/tests/test_book_field_sanitization.py'
      - 'packages/server/tests/test_llm_output_schemas.py'
      - '.github/workflows/prompt-eval.yml'
  push:
    branches: [main]
    paths:
      - 'packages/server/app/prompts/**'
      - 'packages/server/app/schemas/llm_outputs.py'
      - 'packages/server/app/translations/**'
      - 'packages/server/app/eval/**'
      - 'packages/server/app/utils/sanitizer.py'
      - '.github/workflows/prompt-eval.yml'

concurrency:
  group: prompt-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt-eval:
    name: Prompt regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - run: cd packages/server && uv sync --all-groups --all-extras

      - name: Prompt rendering tests
        working-directory: packages/server
        run: uv run pytest tests/test_prompt_rendering.py tests/test_book_field_sanitization.py tests/test_llm_output_schemas.py -v --tb=short
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: readpal_test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_URL: redis://localhost:6379
          GLM_API_KEY: test-glm-key
          GLM_BASE_URL: https://test.example.com
          DEFAULT_MODEL: glm-4-flash
          FALLBACK_MODEL: glm-4-flash
          LLM_TIMEOUT_SECONDS: 30
          LLM_MAX_RETRIES: 2
          CIRCUIT_FAILURE_THRESHOLD: 5
          CIRCUIT_RESET_TIMEOUT_SECONDS: 60
          MAX_EMBEDDING_CALLS: 100
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          JWT_EXPIRES_IN: 7d
          JWT_ACCESS_WEB: 15m
          JWT_ACCESS_MOBILE: 30m
          JWT_REFRESH_WEB: 7d
          JWT_REFRESH_MOBILE: 30d
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          LOG_LEVEL: WARNING
          LOG_JSON: false
          LLM_LOG_ENABLED: true
          LLM_LOG_RETENTION_DAYS: 7

      - name: Eval infrastructure (mocked)
        working-directory: packages/server
        run: uv run python -m app.eval.eval_runner
        # Full Settings env (same block as the rendering step): the eval
        # runner imports app.config.Settings, whose required fields grew
        # over time — the old 7-var block left 21 fields missing and the
        # step has been failing on ValidationError since 2026-08-28.
        env:
          APP_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: readpal_test
          DB_USER: test
          DB_PASSWORD: test
          REDIS_URL: redis://localhost:6379
          GLM_API_KEY: test-glm-key
          GLM_BASE_URL: https://test.example.com
          DEFAULT_MODEL: glm-4-flash
          FALLBACK_MODEL: glm-4-flash
          LLM_TIMEOUT_SECONDS: 30
          LLM_MAX_RETRIES: 2
          CIRCUIT_FAILURE_THRESHOLD: 5
          CIRCUIT_RESET_TIMEOUT_SECONDS: 60
          MAX_EMBEDDING_CALLS: 100
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          JWT_EXPIRES_IN: 7d
          JWT_ACCESS_WEB: 15m
          JWT_ACCESS_MOBILE: 30m
          JWT_REFRESH_WEB: 7d
          JWT_REFRESH_MOBILE: 30d
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          LOG_LEVEL: WARNING
          LOG_JSON: false
          LLM_LOG_ENABLED: true
          LLM_LOG_RETENTION_DAYS: 7

      - name: AST check — no raw book.title in services
        # Phase 3.2: replaces the brittle grep (which had a `grep -v` bypass
        # letting any line mentioning sanitize_book_field through). The AST
        # check at scripts/check_no_raw_book_fields.py walks Call nodes and
        # flags `title=book.title` / `author=book.author` kwargs that aren't
        # wrapped in sanitize_book_field.
        working-directory: packages/server
        run: uv run python scripts/check_no_raw_book_fields.py app/services/

  # Optional live-eval job — runs only when the secret is available.
  # Skips gracefully for external contributors (no secret → no run).
  prompt-eval-live:
    name: Live eval (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install uv

      - run: cd packages/server && uv sync --all-groups --all-extras

      - name: Run live eval
        working-directory: packages/server
        run: |
          if [ -z "$PROMPT_EVAL_API_KEY" ]; then
            echo "PROMPT_EVAL_API_KEY not set — skipping live eval"
            exit 0
          fi
          # Phase 2 of harness-engineering rollout: live eval now implemented.
          # Runs only the JSON-schema-validated golden entries (DB-dependent
          # services like companion/friend/knowledge/memory_book are skipped
          # via LIVE_SKIP in app/eval/live_runner.py). Cost-capped at 50K
          # tokens via MAX_LIVE_EVAL_TOKENS.
          uv run python -m app.eval.eval_runner --live
        env:
          PROMPT_EVAL_API_KEY: ${{ secrets.PROMPT_EVAL_API_KEY }}
          GLM_API_KEY: ${{ secrets.PROMPT_EVAL_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          MAX_LIVE_EVAL_TOKENS: '50000'
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          LOG_LEVEL: INFO
