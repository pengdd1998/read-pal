name: secret-scan

# Rule-based secret detection (gitleaks) — complements security-review.yml
# (Claude AI review), which is best-effort and silently skips when
# ANTHROPIC_API_KEY is unset. This workflow has no secret dependencies and
# blocks on any detector hit. Added by engineering-upgrade stage 1 (2026-09-05).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the scan covers all commits on PR branches

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
