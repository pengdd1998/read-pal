services:
  # PostgreSQL and Redis are now external infrastructure services on VPS
  # Update DB_HOST and REDIS_URL in environment variables to point to external services

  api:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: production
      # External PostgreSQL infrastructure on VPS
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-readpal}
      DB_USER: ${DB_USER:-readpal}
      # No default: an unset DB_PASSWORD must fail fast instead of silently
      # starting the API against the committed example password.
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # External Redis infrastructure on VPS
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      # ⚠ SECURITY: MinIO credentials below default to the factory defaults
      # (minioadmin/minioadmin). They are kept as optional defaults so local
      # `docker compose up` still works without a .env, but production MUST set
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY in .env on the VPS. The VPS MinIO
      # was provisioned with its own credentials — verify before exposing :9000.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-localhost}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-readpal}
      # GLM AI Configuration
      GLM_API_KEY: ${GLM_API_KEY}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-glm-4.7-flash}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-glm-4-flash}
      # Multi-provider routing (JSON array in .env). Without this passthrough
      # the container only ever sees the legacy single-glm fallback — the
      # mimo fallback defined in .env never reached production (found
      # 2026-09-02 while syncing provider priority).
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      # Embedding provider (any OpenAI-compatible /embeddings endpoint).
      # Empty values fall back to GLM embedding-3; point at an Ollama
      # instance with EMBEDDING_BASE_URL/EMBEDDING_MODEL when configured.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_RESET_TIMEOUT_SECONDS: ${CIRCUIT_RESET_TIMEOUT_SECONDS:-30}
      MAX_EMBEDDING_CALLS: ${MAX_EMBEDDING_CALLS:-300}
      # Per-user daily LLM budgets (0 = disabled). See app/config.py:
      # llm_daily_budget counts REQUESTS/day, llm_daily_token_budget counts TOKENS/day.
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-200}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-500000}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_ACCESS_WEB: ${JWT_ACCESS_WEB:-30m}
      JWT_ACCESS_MOBILE: ${JWT_ACCESS_MOBILE:-2h}
      JWT_REFRESH_WEB: ${JWT_REFRESH_WEB:-7d}
      JWT_REFRESH_MOBILE: ${JWT_REFRESH_MOBILE:-30d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8090,capacitor://localhost,https://localhost}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      LLM_LOG_ENABLED: ${LLM_LOG_ENABLED:-true}
      LLM_LOG_RETENTION_DAYS: ${LLM_LOG_RETENTION_DAYS:-90}
      # SMTP Configuration (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@read-pal.com}
      # Object storage (MinIO / S3-compatible) for book covers — optional.
      # When unset, covers fall back to the generated gradient placeholder.
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_BUCKET: ${OSS_BUCKET:-read-pal}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_SECURE: ${OSS_SECURE:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - default
      - shared-infra

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

networks:
  shared-infra:
    external: true

# No local volumes needed - all data services are external infrastructure
